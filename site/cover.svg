<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="'Lora',Georgia,'Times New Roman','Songti SC',serif" role="img" aria-label="MissionSeek - 寻见使命，复利一生">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1411"/>
      <stop offset="0.55" stop-color="#15241E"/>
      <stop offset="1" stop-color="#080D0B"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#F7F2E7"/>
      <stop offset="0.46" stop-color="#ECD79C"/>
      <stop offset="0.72" stop-color="#D9B96A"/>
      <stop offset="1" stop-color="#B6D0C2"/>
    </linearGradient>
    <radialGradient id="auraPine" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3E7D64" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#2E5A49" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2E5A49" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraGold" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C9A24B" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#C9A24B" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#C9A24B" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- ambient depth -->
  <g filter="url(#soft)">
    <ellipse cx="360" cy="150" rx="380" ry="300" fill="url(#auraPine)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 30 18; -14 10; 0 0" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="880" cy="260" rx="420" ry="300" fill="url(#auraGold)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -26 -16; 14 -8; 0 0" dur="22s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- fine frame -->
  <rect x="18" y="18" width="1164" height="364" rx="16" fill="none" stroke="#C9A24B" stroke-opacity="0.20"/>
  <rect x="20" y="20" width="1160" height="360" rx="14" fill="none" stroke="#F7F2E7" stroke-opacity="0.04"/>

  <!-- North Star -->
  <g transform="translate(600 114)" filter="url(#glow)">
    <path d="M0,-30 L2.68,-6.47 L12.7,-12.7 L6.47,-2.68 L30,0 L6.47,2.68 L12.7,12.7 L2.68,6.47 L0,30 L-2.68,6.47 L-12.7,12.7 L-6.47,2.68 L-30,0 L-6.47,-2.68 L-12.7,-12.7 L-2.68,-6.47 Z" fill="#ECD79C">
      <animateTransform attributeName="transform" type="scale" values="1;1.12;1" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="4.5s" repeatCount="indefinite"/>
    </path>
    <circle r="2.2" fill="#0C1411"/>
  </g>

  <!-- artistic wordmark -->
  <text x="600" y="254" text-anchor="middle" font-size="102" font-weight="600" letter-spacing="1.5" fill="url(#ink)" filter="url(#glow)">MissionSeek<tspan fill="#D9B96A">.</tspan></text>

  <!-- subtitle -->
  <text x="600" y="308" text-anchor="middle" font-family="-apple-system,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" letter-spacing="10" fill="#9CB3A7">寻见使命 · 复利一生</text>
</svg>
