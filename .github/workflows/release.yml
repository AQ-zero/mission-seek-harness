name: Build & Release

# Tag a version to build installers and publish them to THIS repo's Releases.
#   git tag v0.1.8 && git push origin v0.1.8
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write   # required to create a Release on this repo

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--mac"
            out: "release/MissionSeek.dmg"
          - os: windows-latest
            args: "--win nsis"
            out: "release/MissionSeek-Setup.exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js (standalone)
        run: npm run build
      - name: Package desktop app
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish installers to this repo's Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: "true"
          # Uses the built-in GITHUB_TOKEN — publishes to THIS repo, no PAT needed.
